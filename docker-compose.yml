services:
  db:
    image: postgres:17-alpine
    container_name: embocraft-postgres
    restart: unless-stopped
    networks:
      - embocraft-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embocraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-embocraftpassword}
      POSTGRES_DB: ${POSTGRES_DB:-embocraft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 可选映射到宿主机，方便数据库工具查看
      - '${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-embocraft} -d ${POSTGRES_DB:-embocraft}',
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
    container_name: embocraft-speech
    restart: unless-stopped
    networks:
      - embocraft-network
    environment:
      # CPU image: reduce inference cost and avoid reloading after five idle minutes.
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__TTL: -1
      # Standard HTTP downloads are more reliable on Docker Desktop/proxy networks.
      HF_HUB_DISABLE_XET: '1'
    volumes:
      - speech_cache:/home/ubuntu/.cache/huggingface/hub
    ports:
      - '${SPEECH_PORT:-${WHISPER_PORT:-8000}}:8000'

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: embocraft-server
    restart: unless-stopped
    networks:
      - embocraft-network
    depends_on:
      db:
        condition: service_healthy
      speech:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-embocraft}:${POSTGRES_PASSWORD:-embocraftpassword}@db:5432/${POSTGRES_DB:-embocraft}?schema=public
      WEB_ORIGIN: '${WEB_ORIGIN:-*}'
      AGENT_GATEWAY_TOKEN: '${AGENT_GATEWAY_TOKEN:-}'
      AGENT_GATEWAY_ALLOWED_ORIGINS: '${AGENT_GATEWAY_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}'
      SPEECH_API_URL: '${SPEECH_API_URL:-http://speech:8000/v1}'
    volumes:
      - server_data:/app/.data
    ports:
      - '${SERVER_PORT:-2567}:2567'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: embocraft-web
    restart: unless-stopped
    networks:
      - embocraft-network
    depends_on:
      - server
    ports:
      - '${WEB_PORT:-80}:80'

networks:
  embocraft-network:
    name: embocraft-network
    driver: bridge

volumes:
  postgres_data:
    name: embocraft_postgres_data
  speech_cache:
    name: embocraft_speech_cache
  server_data:
    name: embocraft_server_data
