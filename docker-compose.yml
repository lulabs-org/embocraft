services:
  db:
    image: postgres:17-alpine
    container_name: voxel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxelpassword}
      POSTGRES_DB: ${POSTGRES_DB:-voxel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 可选映射到宿主机，方便数据库工具查看
      - '${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-voxel} -d ${POSTGRES_DB:-voxel}',
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
    container_name: voxel-speech
    restart: unless-stopped
    environment:
      # CPU image: reduce inference cost and avoid reloading after five idle minutes.
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__TTL: -1
      # Standard HTTP downloads are more reliable on Docker Desktop/proxy networks.
      HF_HUB_DISABLE_XET: '1'
    networks:
      default:
        aliases: [whisper]
    volumes:
      - speech_cache:/home/ubuntu/.cache/huggingface/hub
    ports:
      - '${SPEECH_PORT:-${WHISPER_PORT:-8000}}:8000'

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: voxel-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      speech:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: 2567
      DATABASE_URL: postgresql://${POSTGRES_USER:-voxel}:${POSTGRES_PASSWORD:-voxelpassword}@db:5432/${POSTGRES_DB:-voxel}?schema=public
      WEB_ORIGIN: '${WEB_ORIGIN:-*}'
      AGENT_GATEWAY_TOKEN: '${AGENT_GATEWAY_TOKEN:-}'
      AGENT_GATEWAY_ALLOWED_ORIGINS: '${AGENT_GATEWAY_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}'
      VOICE_PROVIDER: '${VOICE_PROVIDER:-mock}'
      SPEECH_API_URL: '${SPEECH_API_URL:-http://speech:8000/v1}'
      WHISPER_API_URL: '${WHISPER_API_URL:-}'
      PIPER_API_URL: '${PIPER_API_URL:-}'
      ASR_PROVIDER: '${ASR_PROVIDER:-auto}'
      ASR_MODEL_DIR: '${ASR_MODEL_DIR:-/app/models}'
      SENSE_VOICE_MODEL: '${SENSE_VOICE_MODEL:-sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17}'
      ASR_THREADS: '${ASR_THREADS:-2}'
      DEEPSEEK_API_KEY: '${DEEPSEEK_API_KEY:-}'
      DEEPSEEK_MODEL: '${DEEPSEEK_MODEL:-deepseek-flash}'
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-}'
      OLLAMA_MODEL: '${OLLAMA_MODEL:-}'
    volumes:
      - server_data:/app/.data
      # SenseVoice 模型已内置到镜像；如需额外模型包，可再只读挂载（会覆盖镜像内 /app/models）：
      # - ./models:/app/models:ro
    ports:
      - '${SERVER_PORT:-2567}:2567'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: voxel-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  postgres_data:
    name: voxel_postgres_data
  speech_cache:
    name: voxel_whisper_cache
  server_data:
    name: voxel_server_data
